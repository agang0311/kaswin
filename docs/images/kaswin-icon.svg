<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11221c"/>
      <stop offset="100%" stop-color="#070e0c"/>
    </linearGradient>
    <linearGradient id="ticketFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bf0c6"/>
      <stop offset="100%" stop-color="#4fbf8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Level Ticket Silhouette + Center Winning Star -->
  <g transform="translate(256 256) scale(1.3)">
    <!-- Solid ticket body with side notches -->
    <path d="M -144 -86
             Q -144 -102 -128 -102
             L 128 -102
             Q 144 -102 144 -86
             L 144 -28
             A 28 28 0 0 0 144 28
             L 144 86
             Q 144 102 128 102
             L -128 102
             Q -144 102 -144 86
             L -144 28
             A 28 28 0 0 0 -144 -28
             Z"
          fill="url(#ticketFill)"/>

    <!-- Subtle perforation line on the right third -->
    <line x1="64" y1="-80" x2="64" y2="80"
          stroke="#0a1612"
          stroke-opacity="0.28"
          stroke-width="10"
          stroke-dasharray="14 14"
          stroke-linecap="round"/>

    <!-- Winning gold 'K' emblem -->
    <g transform="translate(-32 0)">
      <path d="M -32 -52 L -12 -52 L -12 -8 L 28 -52 L 50 -52 L 8 -4 L 52 52 L 28 52 L -12 2 L -12 52 L -32 52 Z"
            fill="url(#gold)"
            stroke="#0a1612"
            stroke-width="14"
            stroke-linejoin="round"
            paint-order="stroke fill"/>
    </g>
  </g>
</svg>
