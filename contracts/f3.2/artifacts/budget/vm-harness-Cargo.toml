[package]
name = "kaswin-vm-budget"
version = "0.1.0"
edition = "2021"
publish = false

# Path dependencies on the pinned rusty-kaspa checkout at cfafeb4c093fa37a303f1b9f19c58f986b870ce3.
# crypto/txscript, consensus/core and crypto/hashes are verified byte-clean against that commit before building.
[dependencies]
kaspa-consensus-core = { path = "../rusty-kaspa/consensus/core" }
kaspa-txscript = { path = "../rusty-kaspa/crypto/txscript" }
kaspa-hashes = { path = "../rusty-kaspa/crypto/hashes" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1.0"

[[test]]
name = "hardened_vm"
path = "tests/hardened_vm.rs"
harness = true

[profile.test]
opt-level = 2
overflow-checks = true
