# Pushing a tag vX.Y.Z builds Kaswin from that exact tag and publishes a release with it.
# A manual run (workflow_dispatch) only builds and reports the hashes; it never publishes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Collect release files
        run: |
          set -euo pipefail
          node -e "const m=require('./dist/build-manifest.json'); if (!['mainnet','tn10'].includes(m.mode) || !m.capabilities?.tn10Trading || !Array.isArray(m.compatibleProfiles) || !m.compatibleProfiles.length) process.exit(1)"
          mkdir release
          cp dist/index.html release/kaswin.html
          cp dist/kaspire-wc.js release/kaspire-wc.js
          cp dist/build-manifest.json release/build-manifest.json
          (cd release && sha256sum kaswin.html kaspire-wc.js build-manifest.json > SHA256SUMS)
          {
            echo '### Kaswin build'
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then echo "tag $TAG does not match package.json $version"; exit 1; fi
          html="$(awk '$2 == "kaswin.html" {print $1}' release/SHA256SUMS)"
          node - "$TAG" "$GITHUB_SHA" "$html" <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const [tag, sha, htmlSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync('dist/build-manifest.json', 'utf8'));
          const curProfiles = Object.fromEntries(manifest.compatibleProfiles.map(p => [p.protocolId, p.profileId]));

          const git = (...args) => {
            try { return execFileSync('git', args, {encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore']}).trim(); }
            catch { return ''; }
          };
          const prevTag = (git('tag', '--merged', 'HEAD^', '--list', 'v*', '--sort=-version:refname') || git('tag', '--list', 'v*', '--sort=-version:refname'))
            .split('\n').map(s => s.trim()).filter(s => s && s !== tag)[0] || '';

          const prevProfiles = {};
          if (prevTag) {
            const prevRolling = git('show', `${prevTag}:contracts/pins.json`);
            if (prevRolling) {
              try {
                const pid = JSON.parse(prevRolling).profileId;
                if (pid) prevProfiles['rolling-v1'] = pid;
              } catch {}
            }
            const prevKusdt = git('show', `${prevTag}:contracts/kusdt-v2/artifacts/template-pins.json`);
            if (prevKusdt) {
              try {
                const pid = JSON.parse(prevKusdt)?.templates?.m_open?.templateHash;
                if (pid) prevProfiles['kusdt-v2'] = pid;
              } catch {}
            }
          }

          const changes = [];
          if (prevTag && Object.keys(prevProfiles).length) {
            const keys = [...new Set([...Object.keys(prevProfiles), ...Object.keys(curProfiles)])].sort();
            for (const k of keys) {
              const oldPid = prevProfiles[k] || null;
              const newPid = curProfiles[k] || null;
              if (oldPid !== newPid) {
                if (!oldPid) changes.push(`- Added \`${k}\`: \`${newPid}\``);
                else if (!newPid) changes.push(`- Removed \`${k}\` (previously \`${oldPid}\`)`);
                else changes.push(`- **Changed \`${k}\` (incompatible with earlier rounds)**: \`${oldPid}\` → \`${newPid}\``);
              }
            }
          }

          let changelogSection = '';
          if (fs.existsSync('CHANGELOG.md')) {
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const startIdx = lines.findIndex(l => l.startsWith(`## [${tag}]`));
            if (startIdx >= 0) {
              let endIdx = lines.length;
              for (let i = startIdx + 1; i < lines.length; i++) {
                if (lines[i].startsWith('## [')) { endIdx = i; break; }
              }
              changelogSection = lines.slice(startIdx + 1, endIdx).join('\n').replace(/\n---\s*$/, '').trim();
            }
          }

          if (changes.length) {
            if (!changelogSection) {
              console.error(`ERROR: Compatible contract profiles changed since ${prevTag}, but CHANGELOG.md has no ## [${tag}] entry.`);
              process.exit(1);
            }
            for (const [k, pid] of Object.entries(curProfiles)) {
              if (prevProfiles[k] !== pid && !changelogSection.includes(pid)) {
                console.error(`ERROR: CHANGELOG.md ## [${tag}] must document the updated profileId for ${k}: ${pid}`);
                process.exit(1);
              }
            }
          }

          const profileTable = [
            '| Protocol | Asset | Contract Profile ID |',
            '|---|---|---|',
            ...manifest.compatibleProfiles.map(p => `| \`${p.protocolId}\` | ${p.asset} | \`${p.profileId}\` |`),
          ].join('\n');

          const hasProfilesInChangelog = /###\s+Compatible Contract Profiles/i.test(changelogSection);
          const parts = [
            'Permissionless, serverless on-chain raffle single-page application on Kaspa L1. Self-contained HTML bundle with no backend and no custodial funds.',
            '',
            ...(changes.length ? [
              `> [!IMPORTANT]`,
              `> **Compatible contract profiles changed since \`${prevTag}\`** (rounds created under older profiles appear read-only under *Incompatible rounds*; use the matching historical release to operate them):`,
              ...changes.map(c => `> ${c}`),
              '',
            ] : []),
            ...(hasProfilesInChangelog ? [] : ['### Compatible Contract Profiles', '', profileTable, '']),
            ...(changelogSection ? [changelogSection, ''] : []),
            '### Build & Artifacts',
            '',
            `- Source commit: \`${sha}\``,
            '- Built from the commit above by GitHub Actions (`npm ci && npm run build`).',
            '',
            '| File | Description |',
            '|---|---|',
            '| `kaswin.html` | Main SPA bundle (defaults to Kaspa Mainnet, switchable to Testnet 10) |',
            '| `kaspire-wc.js` | Lazy-loaded Kaspire WalletConnect v2 module (loaded only when connecting Kaspire) |',
            '| `build-manifest.json` | Build mode, compatible contract profiles, toolchain versions, source & artifact hashes |',
            '| `SHA256SUMS` | SHA-256 checksums for all release files |',
            '',
            `\`kaswin.html\` SHA-256: \`${htmlSha}\``,
            '',
            'Verify downloads with `sha256sum -c SHA256SUMS`, or check out the commit above and rebuild locally to compare.',
            '',
            '### Usage & Security',
            '',
            '- Requires **KasWare**, **Kastle**, or **Kaspire** wallet. Serve over HTTPS or via a local static server (e.g. `python3 -m http.server 8000` and open `http://localhost:8000/kaswin.html`); browser extensions do not inject into `file://` URLs.',
            '- No formal third-party security audit has been performed. Only commit funds you can afford to lose.',
          ];
          fs.writeFileSync('notes.md', parts.join('\n') + '\n');
          NODE
          gh release create "$TAG" release/kaswin.html release/kaspire-wc.js release/build-manifest.json release/SHA256SUMS \
            --verify-tag --title "Kaswin ${TAG#v}" --notes-file notes.md
