# Pushing a tag vX.Y.Z builds the mainnet trading HTML from that exact tag and publishes a release with it.
# A manual run (workflow_dispatch) only builds and reports the hashes; it never publishes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mainnet
      - name: Collect release files
        run: |
          set -euo pipefail
          node -e "const m=require('./dist/build-manifest.json'); if (m.mode!=='mainnet' || !m.capabilities.mainnetTrading) process.exit(1)"
          mkdir release
          cp dist/index.html release/kaswin.html
          cp dist/build-manifest.json release/build-manifest.json
          (cd release && sha256sum kaswin.html build-manifest.json > SHA256SUMS)
          {
            echo '### Kaswin mainnet trading build'
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then echo "tag $TAG does not match package.json $version"; exit 1; fi
          profile="$(node -p "require('./dist/build-manifest.json').contract.profileId")"
          html="$(awk '$2 == "kaswin.html" {print $1}' release/SHA256SUMS)"
          cat > notes.md <<EOF
          基于 Kaspa L1 covenant 的抽奖协议单页应用。整个应用就是一个自包含 HTML 文件，没有后端，也不托管资金。

          - 源码提交：\`$GITHUB_SHA\`
          - 合约 Profile ID：\`$profile\`
          - 本 release 的附件由 GitHub Actions 从上述提交构建（\`npm ci && npm run build:mainnet\`）。

          | 文件 | 说明 |
          |---|---|
          | \`kaswin.html\` | 主网交易构建：主网与 Testnet 10 均可交易；TN10 下另可导入专用测试私钥 |
          | \`build-manifest.json\` | 构建模式、合约 Profile、工具版本、源码与产物哈希 |
          | \`SHA256SUMS\` | 以上文件的 SHA256 |

          \`kaswin.html\` SHA256：\`$html\`

          下载后可用 \`sha256sum -c SHA256SUMS\` 核对；也可以检出上述提交自行构建比对。

          使用：需要 KasWare 或 Kastle 钱包扩展。建议放在 HTTPS 站点，或在本地用静态服务器打开（例如 \`python3 -m http.server 8000\` 后访问 \`http://localhost:8000/kaswin.html\`）；直接双击得到的 \`file://\` 地址下，浏览器默认不会注入钱包扩展。

          没有第三方安全审计。请只投入你能承受损失的金额。
          EOF
          gh release create "$TAG" release/kaswin.html release/build-manifest.json release/SHA256SUMS \
            --verify-tag --title "Kaswin ${TAG#v} · Profile ${profile:0:16}" --notes-file notes.md
