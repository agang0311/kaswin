<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">

<style>:root{
  --bg:#101715;--bg2:#121e19;--panel:#19231f;--panel2:#1d2a24;--panel3:#293a31;--line:#2a3a31;--line2:#3e5548;
  --text:#f0f3eb;--muted:#adbdaf;--dim:#95a697;
  --kas:#8aebbb;--kas2:#6bcfa0;--kas-soft:rgba(138,235,187,.08);--kas-glow:rgba(138,235,187,.12);
  --gold:#f5c451;--gold-soft:rgba(245,196,81,.12);--violet:#a78bfa;--violet-soft:rgba(167,139,250,.12);
  --amber:#f59e0b;--amber-soft:rgba(245,158,11,.12);--rose:#f87171;--rose-soft:rgba(248,113,113,.12);--sky:#60a5fa;--sky-soft:rgba(96,165,250,.12);
  --r1:8px;--r2:12px;--r3:18px;--r4:26px;--shadow:0 18px 50px -18px rgba(0,0,0,.65);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f6f8;--bg2:#e9eef2;--panel:#fff;--panel2:#f6f9fb;--panel3:#edf2f6;--line:#dbe3ea;--line2:#c9d5df;
  --text:#0d1b26;--muted:#4f6474;--dim:#7d8f9d;--kas:#0f9e85;--kas2:#0b7d69;--kas-soft:rgba(15,158,133,.09);--kas-glow:rgba(15,158,133,.18);
  --gold:#b7860b;--gold-soft:rgba(183,134,11,.1);--violet:#6d4fd6;--violet-soft:rgba(109,79,214,.09);--amber:#b45309;--amber-soft:rgba(180,83,9,.09);
  --rose:#dc2626;--rose-soft:rgba(220,38,38,.08);--sky:#2563eb;--sky-soft:rgba(37,99,235,.08);--shadow:0 16px 40px -20px rgba(13,27,38,.25);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:hidden;width:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;width:100%;max-width:100vw;overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 85% -10%,var(--kas-glow),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(167,139,250,.10),transparent 60%)}
a{color:var(--kas);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--kas);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}

/* Shell */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.top-in{max-width:1320px;width:100%;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:18px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.6px;white-space:nowrap}
.logo{width:34px;height:34px;flex-shrink:0;display:block}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.tag.kas{color:var(--kas);border-color:color-mix(in srgb,var(--kas) 50%,transparent);background:var(--kas-soft)}
.nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:12px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav button{padding:7px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button[aria-current=page]{color:var(--text);background:var(--panel3);box-shadow:inset 0 0 0 1px var(--line2)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--kas);box-shadow:0 0 0 3px var(--kas-soft)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--rose)}
.wbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--kas),var(--kas2));color:#03140f;box-shadow:0 6px 18px -6px var(--kas-glow)}
.wbtn.on{background:var(--panel2);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--panel);text-decoration:none}
.icon-btn:hover{color:var(--text)}
.icon-btn{flex-shrink:0}.language-btn{width:38px;font-size:11px;font-weight:750;white-space:nowrap;padding:0}
html[lang=en] .kpi small{white-space:normal;line-height:1.4}
html[lang=en] .kv dt{white-space:normal;max-width:200px}
time{font-variant-numeric:tabular-nums}
@media(max-width:420px){.top-in #walletBtn{margin-left:auto}.top-in .brand .tag{display:none}.top-in .language-btn{width:30px}.top-in>.spacer{display:none}}
@media(min-width:721px) and (max-width:1260px){html[lang=en] .chip.net{display:none}html[lang=en] .nav{margin-left:5px;gap:2px}html[lang=en] .top-in{gap:8px}}
@media(min-width:721px) and (max-width:960px){html[lang=en] .network-label{display:none}}
main{max-width:1320px;width:100%;margin:0 auto;padding:22px 24px 90px;box-sizing:border-box}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin:6px 0 26px}
.hero h1{font-size:40px;line-height:1.12;letter-spacing:-1.4px;margin:6px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--kas),#7dd3fc 45%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:15px;max-width:620px;margin:0 0 18px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.flow h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.flow ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.flow li b{display:block;font-size:13px}.flow li span{font-size:12px;color:var(--muted)}
.flow .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:var(--kas-soft);color:var(--kas)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px}
.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em}
.kpi strong{display:block;font-size:22px;letter-spacing:-.5px;margin-top:3px}
.kpi span{font-size:11px;color:var(--dim)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--panel2);transition:transform .08s ease,background .15s}
.btn:hover:not(:disabled){background:var(--panel3)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--kas),var(--kas2));border-color:transparent;color:#03140f}
.btn.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)}
.btn.gold{background:linear-gradient(135deg,#ffd877,#e0a63a);border-color:transparent;color:#2a1b00}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.link{color:var(--kas);font-weight:600;font-size:13px;display:inline-flex;gap:5px;align-items:center}

/* Toolbar + cards */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.other-rounds-details{display:inline-block}
.other-rounds-details[open]{flex-basis:100%;width:100%}
.other-rounds-details summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
.other-rounds-details summary::-webkit-details-marker{display:none}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.seg button{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel3);color:var(--text)}
.seg .c{font:600 11px var(--mono);color:var(--dim);margin-left:4px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:9px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s;cursor:pointer;overflow:hidden}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tone,var(--dim))}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0;font-size:15px;letter-spacing:-.2px}
.card .big{font-size:26px;font-weight:800;letter-spacing:-.8px}.card .big small{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--kas),var(--sky));border-radius:99px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-mint{--tone:var(--kas)}.t-mint .badge,.badge.t-mint{background:var(--kas-soft);color:var(--kas)}
.t-violet{--tone:var(--violet)}.t-violet .badge,.badge.t-violet{background:var(--violet-soft);color:var(--violet)}
.t-amber{--tone:var(--amber)}.t-amber .badge,.badge.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-gold{--tone:var(--gold)}.t-gold .badge,.badge.t-gold{background:var(--gold-soft);color:var(--gold)}
.t-muted{--tone:var(--dim)}
.src{font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
.empty{grid-column:1/-1;text-align:center;padding:44px 20px;border:1px dashed var(--line2);border-radius:var(--r3);color:var(--muted)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:18px;margin-bottom:16px;box-sizing:border-box;min-width:0;width:100%;max-width:100%}
.panel h2{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}.panel h3{margin:0 0 10px;font-size:14px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start;width:100%;box-sizing:border-box}
.cols>*{min-width:0;width:100%;box-sizing:border-box}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;box-sizing:border-box}
.cols3>*{min-width:0;width:100%;box-sizing:border-box}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0;width:100%;box-sizing:border-box}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;box-sizing:border-box}
.fact dt{font-size:11px;color:var(--muted);font-weight:600}.fact dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;min-width:0;box-sizing:border-box;overflow:hidden}
.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi strong{display:block;font-size:22px;letter-spacing:-.5px;margin-top:3px;overflow-wrap:anywhere}
.kpi span{font-size:11px;color:var(--dim);display:block;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;width:100%;box-sizing:border-box}.kv dt{color:var(--muted);white-space:nowrap;flex:none}.kv dd{margin:0;overflow-wrap:anywhere;min-width:0;word-break:break-word}
.notice{border-radius:12px;padding:11px 13px;font-size:13px;background:var(--sky-soft);border:1px solid color-mix(in srgb,var(--sky) 30%,transparent);color:var(--text);margin:0 0 12px;box-sizing:border-box;overflow-wrap:anywhere}
.notice.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.notice.bad{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 35%,transparent)}
.notice.ok{background:var(--kas-soft);border-color:color-mix(in srgb,var(--kas) 35%,transparent)}
.notice b{font-weight:800}
.hash{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0;vertical-align:middle}
.hash .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hash-link{color:var(--kas);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(73,234,203,.45);transition:color .12s,text-decoration-color .12s}
.hash-link:hover{color:var(--kas2);text-decoration-color:var(--kas)}
.copy{color:var(--dim);padding:2px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}.copy:hover{color:var(--kas)}

/* Lifecycle stepper */
.stepper{display:flex;gap:0;margin:6px 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;box-sizing:border-box;padding-bottom:4px}
.step{flex:1;min-width:80px;position:relative;padding:10px 6px 0;text-align:center;font-size:12px;color:var(--dim);white-space:nowrap}
.step::before{content:"";position:absolute;top:21px;left:-50%;right:50%;height:2px;background:var(--line2)}
.step:first-child::before{display:none}
.step .b{position:relative;z-index:1;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);border:2px solid var(--line2);font:700 11px var(--mono)}
.step.done{color:var(--muted)}.step.done .b{background:var(--kas-soft);border-color:var(--kas);color:var(--kas)}.step.done::before{background:var(--kas)}
.step.now{color:var(--text);font-weight:700}.step.now .b{background:var(--kas);border-color:var(--kas);color:#03140f;box-shadow:0 0 0 5px var(--kas-soft)}
.step.alt .b{border-color:var(--amber);color:var(--amber)}

/* Ticket matrix */
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;margin:10px 0}
.matrix .cell{aspect-ratio:1;border-radius:5px;background:var(--c);display:flex;align-items:center;justify-content:center;color:#04120f;font-size:11px;font-weight:700;font-family:var(--mono);text-decoration:none;position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s;user-select:none}
.matrix .cell:hover{transform:scale(1.18);z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.matrix .cell.active{outline:2px solid var(--text);outline-offset:2px;transform:scale(1.18);z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.matrix .cell.w{outline:2px solid var(--gold);outline-offset:1px;background:var(--gold)!important;color:#1a1300;box-shadow:0 0 8px var(--gold)}
.matrix .cell.me{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.matrix-tip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin:8px 0 10px;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:13px;line-height:1.4}
.matrix-tip .tip-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.matrix-tip .tip-body{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.matrix-tip .tip-placeholder{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tablewrap{max-height:340px;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:100%;box-sizing:border-box}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-size:11px;color:var(--muted);font-weight:700;z-index:1}
tr.me td{background:var(--kas-soft)}tr.win td{background:var(--gold-soft)}

/* Actions */
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.act{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:7px}
.act h4{margin:0;font-size:14px;display:flex;gap:7px;align-items:center}.act p{margin:0;color:var(--muted);font-size:12px;flex:1}
.act.off{opacity:.55}
.why{font-size:11.5px;color:var(--amber)}

/* Forms */
.field{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);font-weight:600;font-size:14px;outline:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--kas);box-shadow:0 0 0 3px var(--kas-soft)}
.field small{font-weight:500;color:var(--dim)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills button{padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;font-weight:700;color:var(--muted)}
.pills button[aria-pressed=true]{border-color:var(--kas);color:var(--kas);background:var(--kas-soft)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}.check input{margin-top:3px;accent-color:var(--kas);width:16px;height:16px}
.err{color:var(--rose);font-size:12.5px;min-height:1em;margin:6px 0 0}

/* Budget calculator */
.slider{width:100%;accent-color:var(--kas)}
.chart{width:100%;height:220px;display:block}
.chart .grid line{stroke:var(--line)}.chart text{fill:var(--dim);font:10px var(--mono)}
.chart path.l{fill:none;stroke-width:2}.chart circle{stroke:var(--bg);stroke-width:2}

/* Modal */
dialog.modal{border:0;padding:0;background:transparent;max-width:min(860px,96vw);width:100%;color:var(--text)}
dialog.modal::backdrop{background:rgba(2,6,12,.66);backdrop-filter:blur(4px)}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.mhead h2{margin:0;font-size:17px;flex:1}
.mbody{padding:18px;overflow:auto}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.progress{display:grid;gap:6px;margin:8px 0}.progress li{list-style:none;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.progress li.ok{color:var(--text)}.progress li.ok::before{content:"✓";color:var(--kas);font-weight:800}.progress li.run::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--kas);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.outs{display:grid;gap:6px;width:100%;box-sizing:border-box}
.out{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);min-width:0;width:100%;box-sizing:border-box}
.out .r{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap;flex:none}
.out.mine{border-color:color-mix(in srgb,var(--kas) 40%,transparent)}
.out .v{font-weight:800;font-family:var(--mono);white-space:nowrap;text-align:right;flex:none}
.out-addr{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px dashed var(--line2);font-weight:800}

/* Toast */
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:200;max-width:min(420px,92vw)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--kas);border-radius:12px;padding:10px 13px;font-size:13px;box-shadow:var(--shadow);animation:fade .2s}
.toast.bad{border-left-color:var(--rose)}.toast.warn{border-left-color:var(--amber)}


footer{max-width:1320px;margin:0 auto;padding:22px 24px 40px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}

ry shows “Accepted · REST”. If the node contradicts REST, the node takes precedence and the result remains unknown."],["我参与的轮次（已读取详情的范围内）","My rounds (among loaded details)"],["笔待确认"," pending "],["/ 共 {0} 条本机记录","/ {0} local records"],["正在核对 {0}/{1}，不会广播…","Checking {0}/{1}; no broadcast…"],["本次有界核对完成；仍未知的记录继续保留输入占用","Bounded check completed; unresolved records keep their input reservations"],["时间","Time"],["动作","Action"],["费用","Fee"],["查看详情","Details"],["还没有提交记录。","No submission records yet."],["本地记录不可用：{0}","Local records unavailable: {0}"],["轮次状态取自索引（{0} 读取），仍属待节点核验的候选信息。","Round state is from the index (read {0}); it remains candidate information pending node verification."],["索引暂未读取或不可用：以下为本机缓存/本机记录，可能不是最新状态。","Index not loaded or unavailable: local cache / records below may be outdated."],["连接钱包后显示你创建或购买过的轮次。","Connect a wallet to see rounds you created or bought into."],["已读取的详情中没有找到相关轮次；不代表全网没有你的参与记录。可在广场打开目标 CID。","No matching rounds in loaded details. This does not mean you have no participation elsewhere. Open the target CID in Explore."],["第 {0} 笔购买","Purchase #{0}"],["封盘 → 封存","Close → Seal"],["封盘 → 退款","Close → Refunds"],["开奖派奖","Draw & pay"],["首批退款","First refund batch"],["后续退款批","Later refund batch"],["购买记录数：","Purchase record count: "],["约占质量","Approx. mass"],["最低网络费（约）","Approx. minimum network fee"],["{0} TKAS 起","From {0} TKAS"],["预算曲线","Budget curves"],["交易手续费 = max(最低转发费, 节点费率 × 交易质量)，其中 compute budget 每单位计 100 g 质量。页面在报价时按实际交易精确计算，单笔上限 0.5 TKAS。","Transaction fee = max(minimum relay fee, node fee rate × transaction mass). Each compute-budget unit contributes 100 g of mass. Quotes use the actual transaction; the per-transaction cap is 0.5 TKAS."],["交易手续费由原生交易 Mass 与节点实时费率动态迭代收敛，单笔风控上限 0.5 TKAS。历史 TN10 样本 377 笔总手续费 7.80619784 TKAS，平均约 0.020706 TKAS；不代表未来费率或完整场景覆盖。compute budget 每单位对应 100 g 算力质量。","Transaction fees dynamically converge from native transaction mass and node fee rates, capped at 0.5 TKAS. The 377 historical TN10 sample transactions cost 7.80619784 TKAS in total, averaging about 0.020706 TKAS; this does not predict future rates or establish complete scenario coverage. Each compute budget unit corresponds to 100 g mass."],["你在信任什么","What you trust"],["Kaspa L1 共识","Kaspa L1 consensus"],["执行三份固定合约：每次状态转换的输出（金额、收款人、后继状态脚本）都由旧状态的脚本逐字节约束。"," enforces three pinned contracts. The old state script constrains each transition’s outputs (amounts, recipients and successor state scripts) byte for byte."],["执行三份固定合约：状态后继、买家退款、中奖者奖金及创建者押金由脚本约束。附加输出和退款末输出不全由本轮脚本约束；本页构建时还应用自己的严格资金布局与费用策略。"," enforces three pinned contracts: state succession, buyer refunds, winner prize, and creator deposit are script-constrained. Auxiliary outputs and refund final outputs are not fully script-constrained; this page enforces strict funding layout and fee policies when building transactions."],["随机数","Randomness"],["来自封存 100 DAA 后首个跨越边界的选中链区块（PASS-A 序列承诺），合约在花费时用 OpChainblockSeqCommit 校验证明，伪造的证明只会让交易失败；不接受其他随机源，样本被拒也不重抽。"," comes from the first selected-chain block crossing the boundary 100 DAA after sealing (PASS-A sequence commitment). On spend, OpChainblockSeqCommit checks the proof. Forged proofs fail; other randomness sources and redraws of rejected samples are not allowed."],["本页","This page"],["只是一个构建器：用嵌入的固定合约帧与核心库生成交易，用移植自 rusty-kaspa 的质量公式报价，用 BIP-340 校验钱包签名。"," is only a builder: embedded pinned contract frames and core libraries construct transactions; mass formulas ported from rusty-kaspa quote fees; BIP-340 verifies wallet signatures."],["Kaspa 节点","Kaspa node"],["（默认 {0} 提供的 kaspad 入口，可在设置中更换）是访问共识的入口：页面通过它读取 UTXO、接受数据与区块头，并提交交易。本页信任所配置节点如实反映 Kaspa 共识；资金规则本身由所有节点共同执行的合约脚本保证。"," (default kaspad endpoint at {0}, editable in settings) is the gateway to consensus. This page reads UTXOs, acceptance data and headers, and submits through it. It trusts the configured node to report consensus honestly; contract scripts enforced by the network govern funds."],["只用于发现轮次和提供账本原文；所有数值在操作前都由节点复验。"," only discovers rounds and supplies ledger data; values are verified against the node before actions."],["只签你自己的普通资金输入（SIGHASH_ALL）。v1 签名不覆盖 compute budget / storage mass，所以页面在签名后自行核对这些字段再提交。"," only signs your ordinary funding inputs (SIGHASH_ALL). v1 signatures do not cover compute budget / storage mass, so this page checks these fields after signing and before submission."],["规则速查","Rules at a glance"],["开放阶段任何人可买；每次购买追加一条目录记录（票号区间 + 买家公钥），票款精确进入状态 UTXO。","Anyone may buy while open. Each purchase appends one directory record (ticket range + buyer public key); the exact ticket payment enters the state UTXO."],["满票、满设定的购买记录上限或到达封盘 DAA 后任何人可封：售出 ≥ 最低票数 → 封存；不足 → 退款；0 张 → 空轮，押金退创建者。","Anyone may close when tickets or purchase records are full, or the closing DAA is reached. Sold ≥ minimum → sealed; below minimum → refunds; zero tickets → empty close, returning the creator’s deposit."],["封存 ≥ 100 DAA 后任何人可执行，一笔交易内三个输出：中奖者（奖池 − 1 TKAS − 网络费）、创建者押金 0.2、执行者赏金 1 TKAS。网络费 ≤ 0.5 TKAS。","Anyone may execute ≥ 100 DAA after sealing. One transaction, three outputs: winner (pool − 1 TKAS − network fee), creator’s 0.2 TKAS deposit, executor’s 1 TKAS bounty. Network fee ≤ 0.5 TKAS."],["超时","Timeout"],["封存 ≥ 432000 DAA 仍未开奖，任何人可转入退款阶段（仍需有人推进并能取得构建所需账本/证明；历史裁剪可能阻止本页构建）。","If no draw occurs ≥ 432000 DAA after sealing, anyone may enter refunding. Someone must still execute it and obtain the required ledger / proof data; pruned history may prevent this page from building the transaction."],["按购买顺序每批 32 条；每条退还 张数×票价 − 0.01 TKAS，0.01 进入执行费池付网络费、余额归执行者；最后一批同时退押金。","In purchase order, up to 32 records per batch. Each receives tickets × price − 0.01 TKAS. These execution fees pay the network fee; the executor receives the remainder. The last batch also returns the deposit."],["固定 Profile","Pinned Profile"],["网络 Genesis（TN10）","Network Genesis (TN10)"],["页面启动时用嵌入的模板尾部重新计算模板哈希与 Profile ID，不一致即拒绝运行。","At startup, template hashes and the Profile ID are recomputed from embedded template tails. Any mismatch prevents the page
